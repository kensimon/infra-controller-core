## =============================================================================
## carbide-bmc-proxy — Standalone BMC proxy
## =============================================================================
## Reuses the carbide-api binary and configuration base, but runs only the
## standalone BMC proxy entrypoint.
## =============================================================================

global:
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  certificate:
    duration: 720h0m0s
    renewBefore: 360h0m0s
    privateKey:
      algorithm: ECDSA
      size: 384
    issuerRef:
      kind: ClusterIssuer
      name: vault-forge-issuer
      group: cert-manager.io
  spiffe:
    trustDomain: forge.local
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: site-controller

namespaceOverride: ""

replicas: 1
serviceAccountName: carbide-bmc-proxy
automountServiceAccountToken: true
annotations:
  configmap.reloader.stakater.com/reload: "carbide-bmc-proxy-config-files, carbide-bmc-proxy-site-config-files"

resources:
  limits:
    cpu: 3
    memory: 32Gi
  requests:
    cpu: 1500m
    memory: 8Gi

service:
  proxy:
    port: 1079
  metrics:
    port: 1080

certificate:
  serviceName: carbide-bmc-proxy
  extraDnsNames: []
  extraUris: []

command:
  - /bin/sh
  - -c
  - /opt/carbide/carbide-api bmc-proxy --config-path /etc/forge/carbide-api/carbide-api-config.toml --site-config-path /etc/forge/carbide-api/site/carbide-api-site-config.toml

env:
  VAULT_PKI_ROLE_NAME: "forge-cluster"
  RUST_BACKTRACE: "full"
  RUST_LIB_BACKTRACE: "0"

extraEnv: []

envFrom:
  vaultApproleTokens:
    secretName: carbide-vault-approle-tokens
  vaultToken:
    secretName: carbide-vault-token
  vaultClusterInfo:
    configMapName: vault-cluster-info
  databaseCredentials:
    secretName: forge-system.carbide.forge-pg-cluster.credentials
  databaseConfig:
    configMapName: forge-system-carbide-database-config

livenessProbe:
  httpGet:
    port: 1080
    scheme: HTTP
  initialDelaySeconds: 20
  periodSeconds: 20
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 20

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 25s

configFiles:
  carbideApiConfig: ""

siteConfig:
  enabled: true
  carbideApiSiteConfig: ""

bmcProxy:
  listen: "[::]:1079"
  allowedPrincipals: []

vaultClusterInfo: {}

databaseConfig: {}

externalService:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations: {}
